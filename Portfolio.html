<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="author" content="Aditya Yadav" />
  <meta name="description" content="Aditya Yadav – Final Year BCA Student & Front-End Web Developer. Explore my portfolio, projects, and skills." />
  <meta name="keywords" content="Aditya Yadav, BCA Student, Front-End Developer, Web Developer, Portfolio, JavaScript, HTML, CSS" />
  <meta property="og:title" content="Aditya Yadav | Front-End Web Developer" />
  <meta property="og:description" content="Final Year BCA Student & Front-End Developer – Explore my portfolio, skills, and projects." />
  <meta property="og:type" content="website" />
  <meta name="theme-color" content="#0b0f19" />
  <title>Aditya Yadav | Front-End Web Developer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    :root {
      --bg-primary: #0b0f19;
      --bg-secondary: #111827;
      --bg-card: rgba(255,255,255,0.03);
      --bg-glass: rgba(255,255,255,0.05);
      --border: rgba(255,255,255,0.08);
      --border-glow: rgba(0,212,255,0.3);
      --accent: #00d4ff;
      --accent2: #7c3aed;
      --accent3: #10b981;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --gradient: linear-gradient(135deg, #00d4ff, #7c3aed);
      --gradient2: linear-gradient(135deg, #7c3aed, #10b981);
      --shadow: 0 25px 50px rgba(0,0,0,0.5);
      --radius: 16px;
      --transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      overflow-x: hidden;
      line-height: 1.6;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-primary); }
    ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 3px; }

    /* Preloader */
    #preloader {
      position: fixed; inset: 0; z-index: 9999;
      background: var(--bg-primary);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 20px;
    }
    .preloader-logo {
      width: 70px; height: 70px; border-radius: 50%;
      background: var(--gradient);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.6rem; font-weight: 800; color: #fff;
      animation: pulse 1.5s ease-in-out infinite;
    }
    .preloader-text {
      font-family: 'Fira Code', monospace;
      color: var(--accent); font-size: 0.9rem;
      animation: blink 1s step-end infinite;
    }
    @keyframes pulse { 0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(0,212,255,0.4)} 50%{transform:scale(1.05);box-shadow:0 0 0 20px rgba(0,212,255,0)} }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

    /* Particles */
    #particles { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .particle {
      position: absolute; border-radius: 50%;
      background: var(--accent); opacity: 0.15;
      animation: float linear infinite;
    }
    @keyframes float {
      0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
      10% { opacity: 0.15; }
      90% { opacity: 0.15; }
      100% { transform: translateY(-100px) rotate(720deg); opacity: 0; }
    }

    /* Navbar */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
      padding: 16px 5%;
      display: flex; align-items: center; justify-content: space-between;
      background: rgba(11,15,25,0.8);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      transition: var(--transition);
    }
    nav.scrolled { background: rgba(11,15,25,0.95); box-shadow: 0 4px 30px rgba(0,0,0,0.3); }
    .nav-logo {
      width: 42px; height: 42px; border-radius: 50%;
      background: var(--gradient);
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem; font-weight: 800; color: #fff;
      text-decoration: none;
      box-shadow: 0 0 20px rgba(0,212,255,0.3);
    }
    .nav-links { display: flex; gap: 8px; list-style: none; }
    .nav-links a {
      text-decoration: none; color: var(--text-secondary);
      font-size: 0.85rem; font-weight: 500;
      padding: 8px 16px; border-radius: 8px;
      transition: var(--transition);
      font-family: 'Fira Code', monospace;
    }
    .nav-links a:hover, .nav-links a.active {
      color: var(--accent); background: rgba(0,212,255,0.08);
    }
    .nav-toggle { display: none; flex-direction: column; gap: 5px; cursor: pointer; padding: 4px; }
    .nav-toggle span { width: 24px; height: 2px; background: var(--text-primary); transition: var(--transition); border-radius: 2px; }

    /* Sections */
    section { position: relative; z-index: 1; }

    /* Hero */
    #home {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 100px 5% 60px;
      text-align: center;
    }
    .hero-content { max-width: 800px; }
    .hero-greeting {
      font-family: 'Fira Code', monospace;
      color: var(--accent); font-size: 1.1rem; margin-bottom: 16px;
      opacity: 0; animation: fadeUp 0.6s ease 0.3s forwards;
    }
    .hero-name {
      font-size: clamp(2.5rem, 7vw, 5rem);
      font-weight: 900; line-height: 1.1;
      margin-bottom: 20px;
      background: var(--gradient);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      opacity: 0; animation: fadeUp 0.6s ease 0.5s forwards;
    }
    .hero-role {
      font-size: clamp(1rem, 2.5vw, 1.3rem);
      color: var(--text-secondary); margin-bottom: 30px; min-height: 2em;
      opacity: 0; animation: fadeUp 0.6s ease 0.7s forwards;
    }
    .typed-cursor { color: var(--accent); animation: blink 1s step-end infinite; }
    .hero-desc {
      color: var(--text-secondary); font-size: 1rem; max-width: 600px;
      margin: 0 auto 40px; line-height: 1.8;
      opacity: 0; animation: fadeUp 0.6s ease 0.9s forwards;
    }
    .hero-btns {
      display: flex; gap: 16px; justify-content: center; flex-wrap: wrap;
      margin-bottom: 48px;
      opacity: 0; animation: fadeUp 0.6s ease 1.1s forwards;
    }
    .btn {
      padding: 14px 28px; border-radius: 10px; font-size: 0.9rem;
      font-weight: 600; text-decoration: none; cursor: pointer;
      border: none; transition: var(--transition); display: inline-flex;
      align-items: center; gap: 8px;
    }
    .btn-primary {
      background: var(--gradient); color: #fff;
      box-shadow: 0 4px 20px rgba(0,212,255,0.3);
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(0,212,255,0.4); }
    .btn-outline {
      background: transparent; color: var(--accent);
      border: 1px solid var(--accent);
    }
    .btn-outline:hover { background: rgba(0,212,255,0.1); transform: translateY(-2px); }
    .hero-socials {
      display: flex; gap: 16px; justify-content: center;
      opacity: 0; animation: fadeUp 0.6s ease 1.3s forwards;
    }
    .social-link {
      width: 44px; height: 44px; border-radius: 50%;
      background: var(--bg-glass); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      color: var(--text-secondary); text-decoration: none;
      transition: var(--transition); font-size: 1rem;
    }
    .social-link:hover { color: var(--accent); border-color: var(--accent); background: rgba(0,212,255,0.1); transform: translateY(-3px); }
    .hero-badge {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--bg-glass); border: 1px solid var(--border);
      border-radius: 100px; padding: 8px 20px; margin-bottom: 30px;
      font-size: 0.8rem; color: var(--text-secondary);
      opacity: 0; animation: fadeUp 0.6s ease 1.5s forwards;
    }
    .hero-tech-stack {
      display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;
      margin-top: 48px;
      opacity: 0; animation: fadeUp 0.6s ease 1.6s forwards;
    }
    .tech-pill {
      background: var(--bg-glass); border: 1px solid var(--border);
      border-radius: 8px; padding: 6px 14px;
      font-family: 'Fira Code', monospace; font-size: 0.78rem; color: var(--text-secondary);
      transition: var(--transition);
    }
    .tech-pill:hover { border-color: var(--accent); color: var(--accent); }
    .scroll-indicator {
      position: absolute; bottom: 40px; left: 50%;
      transform: translateX(-50%);
      display: flex; flex-direction: column; align-items: center;
      gap: 6px; color: var(--text-muted); font-size: 0.75rem;
      animation: bounce 2s ease-in-out infinite;
    }
    @keyframes bounce { 0%,100%{transform:translateX(-50%) translateY(0)} 50%{transform:translateX(-50%) translateY(-8px)} }
    @keyframes fadeUp { from{opacity:0;transform:translateY(30px)} to{opacity:1;transform:translateY(0)} }

    /* Section common */
    .section-label {
      font-family: 'Fira Code', monospace; color: var(--accent);
      font-size: 0.85rem; margin-bottom: 12px; display: block;
    }
    .section-title {
      font-size: clamp(2rem, 4vw, 2.8rem);
      font-weight: 800; margin-bottom: 16px;
    }
    .section-title span { background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .section-line {
      width: 60px; height: 3px; background: var(--gradient);
      border-radius: 2px; margin: 0 auto 60px;
    }
    .section-header { text-align: center; margin-bottom: 0; }

    /* About */
    #about { padding: 100px 5%; }
    .about-grid {
      display: grid; grid-template-columns: 1fr 1.6fr;
      gap: 60px; align-items: center; max-width: 1100px; margin: 0 auto;
    }
    .about-avatar-wrap { display: flex; flex-direction: column; align-items: center; gap: 24px; }
    .about-avatar {
      width: 200px; height: 200px; border-radius: 50%;
      background: var(--gradient);
      display: flex; align-items: center; justify-content: center;
      font-size: 3.5rem; font-weight: 900; color: #fff;
      box-shadow: 0 0 60px rgba(0,212,255,0.2);
      position: relative;
    }
    .about-avatar::after {
      content:''; position: absolute; inset:-4px;
      border-radius: 50%; border: 2px solid transparent;
      background: var(--gradient) border-box;
      -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: destination-out;
      animation: rotate 4s linear infinite;
    }
    @keyframes rotate { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
    .availability-badge {
      display: inline-flex; align-items: center; gap: 8px;
      background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.3);
      border-radius: 100px; padding: 8px 18px;
      font-size: 0.8rem; color: var(--accent3);
    }
    .availability-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent3); animation: pulse2 2s ease-in-out infinite; }
    @keyframes pulse2 { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.5;transform:scale(0.8)} }
    .stats-row { display: flex; gap: 24px; margin: 24px 0; flex-wrap: wrap; }
    .stat-item { text-align: center; }
    .stat-num { font-size: 2rem; font-weight: 800; background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .stat-lbl { font-size: 0.75rem; color: var(--text-muted); }
    .about-name { font-size: 1.8rem; font-weight: 800; margin-bottom: 4px; }
    .about-role-tag { color: var(--accent); font-family: 'Fira Code', monospace; font-size: 0.85rem; margin-bottom: 20px; }
    .about-desc { color: var(--text-secondary); line-height: 1.9; margin-bottom: 24px; }
    .about-info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 28px; }
    .info-item { display: flex; align-items: center; gap: 10px; color: var(--text-secondary); font-size: 0.88rem; }
    .info-item i { color: var(--accent); width: 16px; }
    .education-timeline { margin-top: 32px; }
    .edu-title { font-size: 0.85rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); margin-bottom: 16px; }
    .edu-item {
      padding: 20px; border-radius: var(--radius);
      background: var(--bg-glass); border: 1px solid var(--border);
      margin-bottom: 12px; position: relative; padding-left: 24px;
    }
    .edu-item::before { content:''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--gradient); border-radius: 0 2px 2px 0; }
    .edu-year { font-family: 'Fira Code', monospace; color: var(--accent); font-size: 0.78rem; margin-bottom: 4px; }
    .edu-deg { font-weight: 700; font-size: 0.95rem; margin-bottom: 2px; }
    .edu-school { color: var(--text-secondary); font-size: 0.82rem; }

    /* Skills */
    #skills { padding: 100px 5%; background: var(--bg-secondary); }
    .skills-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 24px; max-width: 1100px; margin: 0 auto;
    }
    .skill-card {
      background: var(--bg-glass); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 28px;
      transition: var(--transition);
    }
    .skill-card:hover { border-color: var(--border-glow); transform: translateY(-4px); box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
    .skill-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .skill-name { font-weight: 700; font-size: 1rem; }
    .skill-pct { font-family: 'Fira Code', monospace; color: var(--accent); font-size: 0.9rem; }
    .skill-desc { color: var(--text-muted); font-size: 0.82rem; margin-bottom: 16px; line-height: 1.6; }
    .skill-bar { height: 6px; background: rgba(255,255,255,0.08); border-radius: 3px; overflow: hidden; }
    .skill-fill { height: 100%; background: var(--gradient); border-radius: 3px; width: 0; transition: width 1.2s cubic-bezier(0.4,0,0.2,1); }

    /* Projects */
    #projects { padding: 100px 5%; }
    .projects-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 28px; max-width: 1100px; margin: 0 auto;
    }
    .project-card {
      background: var(--bg-glass); border: 1px solid var(--border);
      border-radius: var(--radius); overflow: hidden;
      transition: var(--transition);
    }
    .project-card:hover { border-color: var(--border-glow); transform: translateY(-6px); box-shadow: 0 30px 60px rgba(0,0,0,0.4); }
    .project-header {
      padding: 24px 28px 0; display: flex; align-items: center;
      justify-content: space-between; margin-bottom: 16px;
    }
    .project-type { font-family: 'Fira Code', monospace; color: var(--accent); font-size: 0.78rem; }
    .project-status {
      padding: 4px 12px; border-radius: 100px; font-size: 0.72rem;
      background: rgba(124,58,237,0.15); color: #a78bfa; border: 1px solid rgba(124,58,237,0.3);
    }
    .project-body { padding: 0 28px 28px; }
    .project-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 12px; }
    .project-desc { color: var(--text-secondary); font-size: 0.88rem; line-height: 1.7; margin-bottom: 20px; }
    .project-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
    .project-tag {
      padding: 4px 12px; border-radius: 6px; font-size: 0.75rem;
      background: rgba(0,212,255,0.08); color: var(--accent); border: 1px solid rgba(0,212,255,0.15);
    }
    .project-links { display: flex; gap: 12px; }
    .project-link {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 18px; border-radius: 8px; font-size: 0.82rem;
      text-decoration: none; font-weight: 500; transition: var(--transition);
    }
    .project-link.primary { background: var(--gradient); color: #fff; }
    .project-link.secondary { background: transparent; color: var(--text-secondary); border: 1px solid var(--border); }
    .project-link:hover { opacity: 0.85; transform: translateY(-2px); }

    /* Resume */
    #resume { padding: 100px 5%; background: var(--bg-secondary); }
    .resume-card {
      max-width: 600px; margin: 0 auto;
      background: var(--bg-glass); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 48px; text-align: center;
    }
    .resume-icon {
      width: 80px; height: 80px; border-radius: 50%;
      background: var(--gradient); margin: 0 auto 20px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.8rem; color: #fff;
    }
    .resume-filename { font-family: 'Fira Code', monospace; color: var(--text-muted); font-size: 0.82rem; margin-bottom: 24px; }
    .resume-name-big { font-size: 1.6rem; font-weight: 800; margin-bottom: 4px; }
    .resume-sub { color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 8px; }
    .resume-edu { color: var(--text-muted); font-size: 0.82rem; margin-bottom: 32px; }
    .resume-divider { border: none; border-top: 1px solid var(--border); margin: 28px 0; }
    .resume-desc { color: var(--text-secondary); font-size: 0.9rem; line-height: 1.7; margin-bottom: 28px; }

    /* Contact */
    #contact { padding: 100px 5%; }
    .contact-grid {
      display: grid; grid-template-columns: 1fr 1.4fr;
      gap: 60px; max-width: 1100px; margin: 0 auto; align-items: start;
    }
    .contact-info h3 { font-size: 1.5rem; font-weight: 700; margin-bottom: 12px; }
    .contact-info p { color: var(--text-secondary); line-height: 1.8; margin-bottom: 32px; }
    .contact-item {
      display: flex; align-items: center; gap: 16px;
      padding: 16px; border-radius: var(--radius);
      background: var(--bg-glass); border: 1px solid var(--border);
      margin-bottom: 12px; text-decoration: none; color: inherit;
      transition: var(--transition);
    }
    .contact-item:hover { border-color: var(--border-glow); }
    .contact-icon {
      width: 44px; height: 44px; border-radius: 10px;
      background: rgba(0,212,255,0.1); border: 1px solid rgba(0,212,255,0.2);
      display: flex; align-items: center; justify-content: center;
      color: var(--accent); font-size: 1rem; flex-shrink: 0;
    }
    .contact-item-label { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 2px; }
    .contact-item-val { font-size: 0.92rem; color: var(--text-primary); }
    .contact-socials { display: flex; gap: 12px; margin-top: 24px; }
    .contact-form-wrap {
      background: var(--bg-glass); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 40px;
    }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 0.82rem; color: var(--text-secondary); margin-bottom: 8px; font-weight: 500; }
    .form-group input, .form-group textarea {
      width: 100%; background: rgba(255,255,255,0.04);
      border: 1px solid var(--border); border-radius: 10px;
      padding: 14px 16px; color: var(--text-primary);
      font-family: 'Inter', sans-serif; font-size: 0.9rem;
      transition: var(--transition); outline: none; resize: none;
    }
    .form-group input:focus, .form-group textarea:focus {
      border-color: var(--accent); background: rgba(0,212,255,0.03);
      box-shadow: 0 0 0 3px rgba(0,212,255,0.08);
    }
    .form-group textarea { height: 140px; }
    .form-success {
      display: none; padding: 14px; border-radius: 10px;
      background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.3);
      color: var(--accent3); f
